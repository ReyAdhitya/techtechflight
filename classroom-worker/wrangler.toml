name = "techtechflight-classroom"
main = "worker.js"
compatibility_date = "2026-08-12"
workers_dev = true

# A Durable Object per classroom code. KV's 1,000 writes a day per account was spent by a
# single open board in ninety minutes on 2026-08-12; this store's allowance a classroom
# cannot exhaust in a morning, and it is strongly consistent, which a live room wants.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Classroom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Classroom"]
